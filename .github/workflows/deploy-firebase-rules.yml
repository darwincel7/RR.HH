name: Deploy Firebase Rules

# Auto-deploys the Firestore + Storage security rules to the "produccion" database
# whenever they change on main. This is what lets rule fixes go live without anyone
# opening the Firebase console — a push IS the deploy.
#
# ONE-TIME SETUP (see FIREBASE_DEPLOY_SETUP.md):
#   Add a repository secret named FIREBASE_SERVICE_ACCOUNT containing the JSON of a
#   Firebase service account key (Project Settings -> Service accounts -> Generate new
#   private key). Nothing else is required.

on:
  push:
    branches: [main]
    paths:
      - 'firestore.rules'
      - 'storage.rules'
      - 'firebase.json'
      - '.firebaserc'
  workflow_dispatch: {}

jobs:
  deploy-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Write service-account credentials
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-sa.json
        run: |
          if [ -z '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' ]; then
            echo "::error::Falta el secreto FIREBASE_SERVICE_ACCOUNT. Mira FIREBASE_DEPLOY_SETUP.md"
            exit 1
          fi
          printf '%s' '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$GOOGLE_APPLICATION_CREDENTIALS"

      # Firestore rules are the security-critical piece — this step MUST succeed.
      # Deployed on its own because the Storage deploy performs a serviceusage API
      # pre-check that needs an extra IAM role the deploy key may not have.
      - name: Deploy Firestore rules
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-sa.json
        run: |
          firebase deploy \
            --only firestore:rules \
            --project gen-lang-client-0929279196 \
            --non-interactive

      # Best-effort: Storage rules change rarely. If the key lacks the serviceusage
      # permission this is skipped with a warning instead of failing the whole run.
      - name: Deploy Storage rules (best effort)
        continue-on-error: true
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-sa.json
        run: |
          firebase deploy \
            --only storage \
            --project gen-lang-client-0929279196 \
            --non-interactive \
          || echo "::warning::No se pudieron desplegar las reglas de Storage (falta permiso serviceusage). Las de Firestore SÍ se desplegaron."

      - name: Remove credentials
        if: always()
        run: rm -f "${{ runner.temp }}/firebase-sa.json"
